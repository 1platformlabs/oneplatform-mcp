name: Documentation freshness

# Read-only monitoring. No token, issue writes, publication or deployment.
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  freshness:
    runs-on: ubuntu-latest
    # Downloads: 120 s budget + one retry per contract (scripts/check-docs-freshness.mjs).
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/check-docs-freshness.self-test.mjs
      - run: node scripts/check-docs-freshness.mjs
