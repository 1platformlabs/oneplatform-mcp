# SonarCloud automatic analysis.
# src/generated/tools.ts is GENERATED from the public OpenAPI by
# scripts/build-tools.mjs (one JSON object per tool, same shape by design) and
# CI fails if it drifts from the spec. It stays analysed for bugs and security;
# it is only left out of copy-paste detection, where every tool would count as
# a duplicate of the previous one.
sonar.cpd.exclusions=src/generated/**
